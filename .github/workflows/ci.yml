name: Rust + Python CI

on:
    push:
        branches: [ main, dev ]
    pull_request:
jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version:
                    - "3.10"
                    - "3.11"
                    - "3.12"
        steps:
            - uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v7

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Set up Python and install dependencies
              run: |
                uv python install ${{ matrix.python-version }}
                uv venv --python ${{ matrix.python-version }}
                uv pip install maturin numpy pytest

            - name: Build and test with maturin + uv
              run: |
                source .venv/bin/activate
                cargo clean
                maturin develop --release
                pytest tests

            - name: Run Rust tests
              run: cargo test

    # Advisory cross-repo signal: cross-traffic-middleware consumes this library through a
    # sibling path dependency, so an API change here can break it while every gate in this
    # repo stays green. continue-on-error because a deliberate breaking change is red here
    # until the middleware's companion PR merges; read a failure as "coordinate the
    # migration", not "this PR is broken".
    consumer-smoke:
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@v6
              with:
                path: transportations-library

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Check cross-traffic-middleware against this branch
              run: |
                # A breaking change here should ship with a companion middleware branch of the
                # SAME NAME as this branch; the job checks against it when it exists, so a
                # coordinated pair proves itself green. Otherwise it checks middleware main.
                BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
                git clone --depth 1 --branch "$BRANCH" https://github.com/crosstraffic/cross-traffic-middleware.git \
                  && echo "checked out companion branch $BRANCH" \
                  || git clone --depth 1 https://github.com/crosstraffic/cross-traffic-middleware.git
                cd cross-traffic-middleware
                cargo check
